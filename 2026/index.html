<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ichiyotsu</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FDF8F2" id="theme-color">
  <style>
    html, body { margin: 0; min-height: 100%; background: #FDF8F2; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #151210; }
  </style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ichiyotsu-theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (dark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.getElementById('theme-color');
        if (meta) meta.content = theme === 'dark' ? '#151210' : '#FDF8F2';
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    if (new URLSearchParams(location.search).has('preview')) {
      for (const href of ['/tokipage/assets/css/tokens.css', '/2026/site.css']) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      }
      const { renderPage } = await import('./render.js');
      const root = document.getElementById('app');
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin) return;
        if (event.data?.type === 'ichiyotsu-2026') renderPage(root, event.data.content);
        if (event.data?.type === 'ichiyotsu-2026-theme') {
          document.documentElement.dataset.theme = event.data.theme === 'dark' ? 'dark' : 'light';
          document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
        }
      });
      parent.postMessage({ type: 'ichiyotsu-2026-ready' }, location.origin);
    }
  </script>
</body>
</html>
