  <script>
    document.documentElement.classList.replace('no-js', 'js');
    (function () {
      try {
        var saved = localStorage.getItem('ichiyotsu-theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : (dark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <main class="page" id="app">

      <li><a href="https://github.com/ichiyotsu">GitHub</a></li>
      <li><a href="/tokipage/">TokiPage.</a></li>
      <li><a href="/forcity/">围城市政</a></li>
    </ul></section>
  </main>
  <script type="module">
    import { renderPage } from './render.js';
    const root = document.getElementById('app');
    const preview = new URLSearchParams(location.search).has('preview');
    if (preview) {
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin) return;
        if (event.data?.type === 'ichiyotsu-2026') renderPage(root, event.data.content);
        if (event.data?.type === 'ichiyotsu-2026-theme') {
          document.documentElement.dataset.theme = event.data.theme === 'dark' ? 'dark' : 'light';
          document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
        }
      });
      parent.postMessage({ type: 'ichiyotsu-2026-ready' }, location.origin);
    } else {
      fetch('/2026/content.json').then((res) => res.json()).then((data) => renderPage(root, data)).catch(() => {});
    }
  </script>
</body>
</html>
