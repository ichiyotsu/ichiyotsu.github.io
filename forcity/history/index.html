<h1 class="article__title">城市沿革</h1>
<div class="article__body">
<p>围城先有城墙，后有市政。城墙把西城、东岸和港区圈在同一套路网里，市政厅负责把这三处的公告放到同一张纸上。</p>
<p>2026 年，官网、新闻、交通和民生一起开放。市民个人页面只对已经登记的人打开。</p>
